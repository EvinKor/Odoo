[options]
proxy_mode = True
http_enable_cors = True
http_cors_allow_origin = http://192.168.0.113:3000
http_cors_allow_methods = GET,POST,OPTIONS
http_cors_allow_headers = Content-Type,Authorization
http_cors_allow_credentials = False
xmlrpc_port = 8070
xmlrpc_interface = 0.0.0.0
; This is the password that allows database operations:
; admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
;addons_path = /usr/lib/python3/dist-packages/odoo/addons
default_productivity_apps = True
without_demo = all

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/var/lib/odoo/.local/share/Odoo/addons/17.0
